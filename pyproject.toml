[project]
name = "cas-parser"
version = "0.1.0"
description = "Depository Consolidated Account Statement (CAS) PDF parser — NSDL / CDSL holdings and transactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Akhil Narang", email = "me@akhilnarang.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.9",
    "pydantic>=2.0",
    "pymupdf>=1.26.7",
    "pypdf>=6.10.2",
    "python-dateutil>=2.9.0.post0",
    "rich>=14.2.0",
    "typer>=0.16.0",
]

[project.scripts]
cas-parser = "cas_parser.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff.lint.flake8-bugbear]
# typer.Argument / typer.Option calls in CLI parameter defaults are the
# documented typer pattern, not a mutable-default bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "ty>=0.0.29",
]
